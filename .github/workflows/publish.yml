name: Publish to Hex

# Runs when a version tag is pushed (git tag v0.1.1 && git push origin v0.1.1).
# Needs the repository secret HEX_API_KEY (create it with: mix hex.user key generate).
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: hex
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - name: The tag must match the package version
        run: |
          VERSION=$(grep -m1 '@version' mix.exs | cut -d'"' -f2)
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $VERSION"; exit 1; }

      - name: Test
        run: |
          mix deps.get
          mix test

      - name: Publish
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
